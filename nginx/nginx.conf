#  1. Bot requests /ghosthref-internal/ → matches location /.
#   2. location / doesn't serve anything yet — first it runs auth_request /_verdict.
#   3. That fires the internal-only subrequest to /_verdict, which proxies to the bouncer.
#   4. Bouncer answers 204/401/403.
#   5. Only now does location / continue: if 204, it goes on to actually serve the file (try_files); if 401/403, error_page jumps to
#      @throttled/@blocked and the real file is never touched.
events {}

http {
    # One JSON line per request, for Filebeat to ship into Elasticsearch.
    log_format ghosthref escape=json '{"time":"$time_iso8601","ip":"$remote_addr","ua":"$http_user_agent","uri":"$request_uri","referer":"$http_referer","status":$status,"tier":"$tier"}';

    server {
        listen 80;
        root /usr/share/nginx/html;
        access_log /var/log/ghosthref/access.log ghosthref;
        access_log /dev/stdout ghosthref;

        location / {
            # auth_request: nginx pause and fire a second request to /_verdict — using its own connection, invisible to the bot.
            auth_request /_verdict;
            # Pulls the bouncer's verdict into $tier for the log line above — never sent back to the client.
            auth_request_set $tier $upstream_http_x_tier;
            error_page 401 = @throttled;
            error_page 403 = @blocked;
            try_files $uri $uri/ =404;
        }

        # Serve the raw text back when a crawler asked it, public to every visitor, blocked or not.
        location = /robots.txt {
            alias /etc/nginx/robots.txt;
        }

        # Internal only - /_verdict can only ever be called by nginx itself.
        location = /_verdict {
            internal;
            proxy_pass http://bouncer:3000/verdict;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Nginx's own health check.
        location = /healthz {
            return 200 "ok";
        }

        location @throttled {
            return 429 "Too Many Requests";
        }

        location @blocked {
            return 403 "Forbidden";
        }
    }
}
